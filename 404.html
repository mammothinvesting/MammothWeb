<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page Not Found — Mammoth Investing</title>
  <meta name="description" content="The page you were looking for doesn't exist. Head back to Mammoth Investing for AI-powered stock market insights and investing courses.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090f">

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/MammthPurpleLogo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    .nf-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 24px;
      background: radial-gradient(ellipse at 50% 30%, rgba(191, 11, 193, .12), transparent 65%);
    }
    .nf-code {
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: clamp(96px, 22vw, 220px);
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -.03em;
      margin: 0;
    }
    .nf-title {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: clamp(28px, 5vw, 44px);
      color: var(--text);
      margin: 0;
      letter-spacing: -.02em;
    }
    .nf-msg {
      color: var(--text-secondary);
      font-size: 17px;
      max-width: 520px;
      line-height: 1.55;
      margin: 0;
    }
    .nf-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }
    .nf-btn {
      padding: 14px 26px;
      border-radius: var(--radius-full);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .nf-btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 32px rgba(191, 11, 193, .35);
    }
    .nf-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(191, 11, 193, .45); }
    .nf-btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-hover);
    }
    .nf-btn-secondary:hover { background: var(--bg-card-hover); transform: translateY(-2px); }
    .nf-mammoth { width: clamp(120px, 28vw, 220px); height: auto; opacity: .9; }
  </style>
</head>

<body style="background-color: var(--bg); color: var(--text); margin: 0;">
  <div class="nf-wrap">
    <img src="assets/SadAnim.gif" alt="Sad Mammoth" class="nf-mammoth"
      onerror="this.style.display='none'">
    <h1 class="nf-code">404</h1>
    <h2 class="nf-title">Page not found</h2>
    <p class="nf-msg">
      Looks like this page wandered off into the wild. Don't worry — the rest of Mammoth Investing is right where you left it.
    </p>
    <div class="nf-actions">
      <a class="nf-btn nf-btn-primary" href="/">Back to home</a>
      <a class="nf-btn nf-btn-secondary" href="/courses.html">Browse courses</a>
    </div>
  </div>
</body>

</html>
